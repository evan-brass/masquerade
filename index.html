<!DOCTYPE html>
<script>
const is_firefox = typeof RTCPeerConnection.prototype.getIdentityAssertion == 'function';
const config = {
	iceTransportPolicy: 'relay',
	iceServers: [{
		urls: [
			// 'turn:stun.evan-brass.net',
			// 'turn:stun.evan-brass.net?transport=tcp',
			// 'turn:localhost',
			// 'turn:localhost?transport=tcp',
			// 'turn:raspberrypi.local',
			// 'turn:raspberrypi.local?transport=tcp',
			'turn:192.168.0.31',
			'turn:192.168.0.31?transport=tcp',
		],
		username: 'guest',
		credential: 'password'
	}]
};
const hosted = {
	sdpMLineIndex: 0,
	// TODO: Hosted doesn't exist at the moment...
	candidate: `candidate:f 1 udp 42 fe80::1 65535 typ relay raddr :: rport 0`
};
function state(transitions) {
	return new Promise(res => {
		for (const [key, target] of Object.entries(transitions)) {
			target.addEventListener(key, res, {once: true});
		}
	});
}
</script>
<script>
// Log everything.
function log_everything(conn, label = conn.pid) {
	const logger = (...args) => console.log(label, ...args);
	// ['message', 'open', 'close'].forEach(e => conn.dc.addEventListener(e, logger));
	['connectionState', 'iceConnectionState', 'iceGatheringState', 'signalingState'].forEach(p => {
		conn.addEventListener(p.toLowerCase() + 'change', () => logger(p, conn[p]));
	});
	['icecandidate', 'datachannel', 'icecandidateerror', 'negotiationneeded', 'track'].forEach(e => {
		conn.addEventListener(e, logger);
	});
}
</script>

<!-- Hosted -->
<script type="_module">
const h = new RTCPeerConnection(config);
log_everything(h, 'h');
await h.setRemoteDescription({type:'offer',sdp:`v=0
o=- 42 2 IN IP4 0.0.0.0
s=-
t=0 0
a=BUNDLE dc
a=ice-ufrag:doesntmatter
a=ice-pwd:the/ice/password/constant
a=fingerprint:sha-256 C3:E4:A4:B9:DD:56:08:7E:A6:15:5E:F7:EB:0F:BD:24:EB:C4:D4:AD:92:33:91:31:F4:37:3E:C5:57:44:11:D5
m=application 9 UDP/DTLS/SCTP webrtc-datachannel
c=IN IP4 0.0.0.0
a=mid:dc
a=setup:passive
a=sctp-port:5000
`});
let answer;
if (is_firefox) {
	answer = await h.createAnswer();
	answer.sdp = answer.sdp.replace(/a=ice-pwd:.+/img, 'a=ice-pwd:the/ice/password/constant');
}
await h.setLocalDescription(answer);
await h.addIceCandidate(hosted);
console.log(h.localDescription.type, h.localDescription.sdp);
</script>

<!-- Dissolved a<->b -->
 <script type="_module">
const a = new RTCPeerConnection(config);
const b = new RTCPeerConnection(config);
a.createDataChannel('');

log_everything(a, 'a');
log_everything(b, 'b');

// TODO: Firefox would also need to mung the local password because no 487
function dissolve({ type, sdp }) {
	return {
		type,
		sdp: sdp
			.replace(/a=ice-ufrag:.+/img, 'a=ice-ufrag:dissolve')
			.replace(/a=ice-pwd:.+/img, 'a=ice-pwd:the/ice/password/constant')
	};
}

await a.setLocalDescription();
while (a.iceGatheringState != 'complete') await state({'icegatheringstatechange': a});
await b.setRemoteDescription(dissolve(a.localDescription));
await b.setLocalDescription();
while (b.iceGatheringState != 'complete') await state({'icegatheringstatechange': b});
await a.setRemoteDescription(dissolve(b.localDescription));
</script>

<!-- Relay only a<->b -->
<script type="module">
const a = new RTCPeerConnection(config);
const b = new RTCPeerConnection(config);
a.createDataChannel('');

log_everything(a, 'a');
log_everything(b, 'b');

await a.setLocalDescription();
while (a.iceGatheringState != 'complete') await state({'icegatheringstatechange': a});
await b.setRemoteDescription(a.localDescription);

await b.setLocalDescription();
while (b.iceGatheringState != 'complete') await state({'icegatheringstatechange': b});
await a.setRemoteDescription(b.localDescription);
</script>
