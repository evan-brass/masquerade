<!DOCTYPE html>
<script>
const is_firefox = typeof RTCPeerConnection.prototype.getIdentityAssertion == 'function';

function config({
	tcp = is_firefox,
	// Firefox gets confused when a relay candidate becomes prflx when the policy is 'relay':  Chrome keeps using it, firefox stops using it.
	itp = is_firefox ? 'all' : 'relay',
	host = 'localhost',
	// host = 'stun.evan-brass.net',
} = {}) {
	return {
		iceTransportPolicy: itp,
		iceServers: [{
			urls: [
				`turn:${host}${tcp ? '?transport=tcp' : ''}`
			],
			username: 'guest',
			credential: 'password',
		}],
	};
}

// Log everything.
function log_everything(conn, label = conn.pid) {
	const logger = (...args) => console.log(label, ...args);
	// ['message', 'open', 'close'].forEach(e => conn.dc.addEventListener(e, logger));
	['connectionState', 'iceConnectionState', 'iceGatheringState', 'signalingState'].forEach(p => {
		conn.addEventListener(p.toLowerCase() + 'change', () => logger(p, conn[p]));
	});
	['icecandidate', 'datachannel', 'icecandidateerror', 'negotiationneeded', 'track'].forEach(e => {
		conn.addEventListener(e, logger);
	});
}
</script>

<!-- Broadcast autodiscovery -->
<script type="module">
const a = new RTCPeerConnection(config({tcp: true}));
const b = new RTCPeerConnection(config({tcp: true}));
a.createDataChannel('');

log_everything(a, 'a');
log_everything(b, 'b');

await a.setLocalDescription();
await b.setRemoteDescription(a.localDescription);
await b.setLocalDescription();
await a.setRemoteDescription(b.localDescription);
await a.addIceCandidate({
	sdpMLineIndex: 0,
	candidate: `candidate:f 1 udp 42 ${is_firefox ? 'fe80::ffff:ffff:ffff:ffff' : 'ff02::1'} 65535 typ relay raddr :: rport 0`
});
if (is_firefox) {
	// Firefox enforces turn permissions locally, so we have to make both sides of the connection aware of fe80::... so that they accept packets from there.
	await b.addIceCandidate({
		sdpMLineIndex: 0,
		candidate: `candidate:f 1 udp 42 fe80::ffff:ffff:ffff:ffff 65535 typ relay raddr :: rport 0`
	});
}
</script>

<!-- Relay only a(udp)<->b(tcp) -->
<script type="_module">
const a = new RTCPeerConnection(config(true, true));
const b = new RTCPeerConnection(config(true, true));
a.createDataChannel('');

log_everything(a, 'a');
log_everything(b, 'b');

await a.setLocalDescription();
while (a.iceGatheringState != 'complete') await new Promise(res => a.addEventListener('icegatheringstatechange', res, { once: true }));
await b.setRemoteDescription(a.localDescription);

await b.setLocalDescription();
while (b.iceGatheringState != 'complete') await new Promise(res => b.addEventListener('icegatheringstatechange', res, { once: true }));
await a.setRemoteDescription(b.localDescription);
</script>
