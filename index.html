<script>
const is_firefox = typeof RTCPeerConnection.prototype.getIdentityAssertion == 'function';
const config = {
	iceTransportPolicy: 'relay',
	bundlePolicy: 'max-bundle',
	rtcpMuxPolicy: 'require',
	iceServers: [{
		urls: [
			'turn:turn.evan-brass.net',
			'turn:turn.evan-brass.net?transport=tcp',
			'turns:turn.evan-brass.net?transport=tcp',
			'turns:turn.evan-brass.net:443?transport=tcp',
		],
		username: 'guest',
		credential: 'password'
	}]
};
function hosted(prefix = '2a01:4ff:1f0:7e46:c4b0') {
	let [port, ...segments] = crypto.getRandomValues(new Uint16Array(4));
	port |= 0x8000;
	const ip = segments.reduce((a, v) => a + ':' + v.toString(16), prefix);
	return {
		sdpMid: 'dc',
		candidate: `candidate:f 1 udp 42 ${ip} ${port} typ host raddr :: rport 0`
	}
}
function state(transitions) {
	return new Promise(res => {
		for (const [key, target] of Object.entries(transitions)) {
			target.addEventListener(key, res, {once: true});
		}
	});
}
</script>
<script>
// Log everything.
function log_everything(conn, label = conn.pid, channel = conn.dc) {
	const log = console.log.bind(console, label);

	function handle_dc({ channel }) {
		['message', 'open', 'close'].forEach(e => channel.addEventListener(e, log));
	};
	if (channel) handle_dc({ channel });
	conn.addEventListener('datachannel', handle_dc);

	['connectionState', 'iceConnectionState', 'iceGatheringState', 'signalingState'].forEach(p => {
		conn.addEventListener(p.toLowerCase() + 'change', ({ target: { [p]: val }}) => log(p, val));
	});
	['icecandidate', 'datachannel', 'icecandidateerror', 'negotiationneeded', 'track'].forEach(e => {
		conn.addEventListener(e, log);
	});
}
</script>

<!-- Dissolved a<->b -->
<script type="_module">
const a = new RTCPeerConnection(config);
const b = new RTCPeerConnection(config);

log_everything(a, 'a', a.createDataChannel(''));
log_everything(b, 'b');

function dissolve({ type, sdp }) {
	return {
		type,
		sdp: sdp
			.replace(/a=ice-ufrag:.+/img, 'a=ice-lite\na=ice-ufrag:dissolve')
			.replace(/a=ice-pwd:.+/img, 'a=ice-pwd:the/ice/password/constant')
	};
}

await a.setLocalDescription();
while (a.iceGatheringState != 'complete') await state({'icegatheringstatechange': a});
await b.setRemoteDescription(dissolve(a.localDescription));
await b.setLocalDescription();
while (b.iceGatheringState != 'complete') await state({'icegatheringstatechange': b});
await a.setRemoteDescription(dissolve(b.localDescription));
</script>
