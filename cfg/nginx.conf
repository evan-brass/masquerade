user www-data;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

load_module /lib/nginx/modules/ngx_stream_module.so;

events {}

stream {
	# turns
	upstream turns {
		server localhost:5349;
	}
	server {
		listen 5349 ssl;
		# server_name  local.evan-brass.net;
		proxy_pass turn;

		ssl_certificate /etc/letsencrypt/live/local.evan-brass.net/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/local.evan-brass.net/privkey.pem;
		# ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	}

	upstream turn {
		server localhost:3478;
	}
	upstream www {
		server localhost:8443;
	}

	map $ssl_preread_alpn_protocols $upstream {
		~\bh2\b			www;
		~\bhttp/1.1\b	www;
		~\bstun.turn\b	turns;
		default			turns;
	}

	server {
		listen 443;
		proxy_pass $upstream;
		ssl_preread on;
	}
}

http {
	sendfile on;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /var/log/nginx/access.log;

	server {
		listen 8443 ssl;
		http2 on;

		ssl_certificate /etc/letsencrypt/live/local.evan-brass.net/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/local.evan-brass.net/privkey.pem;
		# ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	}
	server {
		listen 80;
		server_name local.evan-brass.net;

		if ($host = local.evan-brass.net) {
			return 301 https://$host$request_uri;
		}

		return 404;
	}
}
