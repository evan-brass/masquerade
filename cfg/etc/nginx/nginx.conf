user www-data;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

load_module /lib/nginx/modules/ngx_stream_module.so;

events {}

stream {
	# turns
	upstream turns {
		server localhost:5349;
	}
	server {
		listen [::]:5349 ssl ipv6only=off;
		# server_name  local.evan-brass.net;
		proxy_pass turn;

		ssl_certificate /etc/letsencrypt/live/turn.evan-brass.net/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/turn.evan-brass.net/privkey.pem;
		# ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	}

	upstream turn {
		server localhost:3478;
	}
	upstream www {
		server localhost:8443;
	}
	upstream ssh {
		server localhost:22;
	}

	map $ssl_preread_alpn_protocols $tls_upstream {
		~\bh2\b			www;
		~\bhttp/1.1\b	www;
		~\bstun.turn\b	turns;
		default			turns;
	}
	map $ssl_preread_protocol $upstream {
		""			ssh;
		default		$tls_upstream;
	}

	server {
		listen [::]:443 ipv6only=off;
		proxy_pass $upstream;
		ssl_preread on;
	}
}

http {
	sendfile on;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /var/log/nginx/access.log;

	server {
		listen 8443 ssl;
		listen [::]:443 quic ipv6only=off;
		http2 on;

		root /var/www;
		index index.html;
		error_page 404 /404.html;

		server_name turn.evan-brass.net;
		ssl_certificate /etc/letsencrypt/live/turn.evan-brass.net/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/turn.evan-brass.net/privkey.pem;
		# ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

		location / {
			add_header Alt-Svc 'h2=":443"; h3=":443";';
		}
	}
	server {
		listen [::]:80 ipv6only=off;
		server_name turn.evan-brass.net;

		if ($host = turn.evan-brass.net) {
			return 301 https://$host$request_uri;
		}

		return 404;
	}
}
