[package]
name = "turn-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
eyre = "0.6.12"
mio = { version = "1.0.4", features = ["net", "os-ext", "os-poll"] }
stun = { path = "../stun" }
tappers = "0.4.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19" }
clap = { version = "4.5.39", features = ["derive"] }
slab = "0.4.9"
md5 = "0.7.0"
rand = "0.9.1"
smoltcp = { version = "0.12.0", default-features = false, features = ["proto-ipv6"] }
